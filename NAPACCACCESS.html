<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Access | Records Management Portal</title>

    <!-- Standard Browser Icons -->
    <link rel="icon" type="image/png" href="Video.gif">
    <link rel="apple-touch-icon" href="Video.gif">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Account Access | Records Management Portal">
    <meta property="og:description" content="Secure authentication gateway for the Records Management Portal.">
    <meta property="og:image" content="Video.gif">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Account Access | Records Management Portal">
    <meta name="twitter:description" content="Secure authentication gateway for the Records Management Portal.">
    <meta name="twitter:image" content="Video.gif">

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html,body{
            width:100%;
            height:100%;
            overflow:hidden;
            font-family:'Inter',sans-serif;
            background:#081425;
        }

        .app-wrapper{
            display:flex;
            flex-direction:column;
            width:100%;
            height:100vh;
        }

        /* Header */
        .system-header{
            height:72px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 24px;
            background:rgba(8,20,37,.90);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            border-bottom:1px solid rgba(255,255,255,.08);
            box-shadow:0 8px 24px rgba(0,0,0,.25);
            z-index:100;
        }

        .header-brand{
            display:flex;
            align-items:center;
            gap:15px;
        }

        .system-logo{
            width:46px;
            height:46px;
            object-fit:contain;
            border-radius:10px;
            animation:pulse 3s ease-in-out infinite;
            filter:drop-shadow(0 0 10px rgba(59,130,246,.55));
        }

        .brand-text{
            display:flex;
            flex-direction:column;
        }

        .brand-title{
            color:#fff;
            font-size:17px;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:1px;
        }

        .brand-subtitle{
            color:#9fb3c8;
            font-size:11px;
            text-transform:uppercase;
            letter-spacing:1.2px;
            margin-top:2px;
        }

        /* Status */
        .system-status{
            display:flex;
            align-items:center;
            gap:8px;
            padding:6px 14px;
            border-radius:20px;
            background:rgba(16,185,129,.10);
            border:1px solid rgba(16,185,129,.25);
        }

        .status-dot{
            width:8px;
            height:8px;
            border-radius:50%;
            background:#10b981;
            box-shadow:0 0 10px #10b981;
        }

        .status-text{
            color:#10b981;
            font-size:11px;
            font-weight:700;
            letter-spacing:.8px;
            text-transform:uppercase;
        }

        /* Iframe */
        .iframe-container{
            flex:1;
            position:relative;
            background:#fff;
        }

        iframe{
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            border:none;
        }

        @keyframes pulse{
            0%,100%{
                filter:drop-shadow(0 0 5px rgba(59,130,246,.4));
            }
            50%{
                filter:drop-shadow(0 0 15px rgba(59,130,246,.85));
            }
        }

        @media(max-width:600px){

            .system-header{
                padding:0 16px;
            }

            .brand-title{
                font-size:14px;
            }

            .brand-subtitle{
                font-size:9px;
            }

            .system-logo{
                width:40px;
                height:40px;
            }

            .status-text{
                display:none;
            }
        }
    </style>
</head>

<body>

<div class="app-wrapper">

    <!-- Header -->
    <header class="system-header">

        <div class="header-brand">
            <img src="Video.gif" alt="Records Management Portal Logo" class="system-logo">

            <div class="brand-text">
                <span class="brand-title">Account Access</span>
                <span class="brand-subtitle">Records Management Portal</span>
            </div>
        </div>

        <div class="system-status">
            <div class="status-dot"></div>
            <span class="status-text">System Online</span>
        </div>

    </header>

    <!-- Portal -->
    <main class="iframe-container">
        <iframe
            src="https://script.google.com/macros/s/AKfycbwoEa2OxgIl0ZQS0wC4geIo8Fo_LQQViUD8DOyo5RmTQGSCwL_0JDWgr9huYWs_CJDs/exec"
            allowfullscreen>
        </iframe>
    </main>

</div>

</body>
</html>
