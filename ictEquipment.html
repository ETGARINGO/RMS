<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <!-- =====================================================
         IT EQUIPMENT INVENTORY
         LOGO / FAVICON
    ====================================================== -->

    <link rel="icon"
          type="image/gif"
          href="https://rms.rprmd9.site/Video.gif">

    <link rel="apple-touch-icon"
          href="https://rms.rprmd9.site/Video.gif">

    <meta name="theme-color"
          content="#0f172a">

    <meta name="application-name"
          content="IT Equipment Inventory">

    <meta name="description"
          content="IT Equipment Inventory Monitoring Portal">


    <title>IT Equipment Inventory</title>


    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            font-family: Arial, Helvetica, sans-serif;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        body { min-width: 280px; }

        .main-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #0f172a;
        }

        /* Branding is hidden once fullscreen is active so the app gets the whole screen. */
        .branding {
            position: absolute;
            top: max(12px, env(safe-area-inset-top));
            left: 15px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 12px;
            min-height: 52px;
            background: rgba(15,23,42,.92);
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 9px;
            box-shadow: 0 4px 16px rgba(0,0,0,.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            user-select: none;
            transition: opacity .2s ease, visibility .2s ease;
        }

        .branding-logo {
            display: block;
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 7px;
            background: rgba(255,255,255,.08);
            flex-shrink: 0;
        }

        .branding-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
            line-height: 1.1;
        }

        .branding-title {
            color: #fff;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .5px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .branding-subtitle {
            margin-top: 4px;
            color: #cbd5e1;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: .3px;
            white-space: nowrap;
        }

        .fs-toggle {
            position: absolute;
            top: max(15px, env(safe-area-inset-top));
            right: 15px;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 88px;
            min-height: 36px;
            padding: 8px 12px;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 7px;
            background: rgba(15,23,42,.92);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .4px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,0,0,.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all .2s ease;
            touch-action: manipulation;
        }

        .fs-toggle:hover { background: rgba(30,58,138,.95); }
        .fs-toggle:active { transform: scale(.96); }

        .sheet-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff;
        }

        iframe {
            display: block;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            outline: none;
            background: #fff;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        .loading-screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: #0f172a;
            color: #fff;
            pointer-events: none;
            transition: opacity .35s ease, visibility .35s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-logo {
            width: 65px;
            height: 65px;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .loading-title {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: .5px;
            text-transform: uppercase;
        }

        .loading-text {
            margin-top: 7px;
            color: #94a3b8;
            font-size: 10px;
        }

        .loader {
            width: 28px;
            height: 28px;
            margin-top: 18px;
            border: 3px solid rgba(255,255,255,.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Active fullscreen: remove all wrapper controls from view. */
        :fullscreen .branding,
        :-webkit-full-screen .branding,
        :fullscreen .fs-toggle,
        :-webkit-full-screen .fs-toggle {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        :fullscreen .main-container,
        :-webkit-full-screen .main-container {
            width: 100vw;
            height: 100vh;
        }

        @media (max-width: 600px) {
            .branding {
                top: max(8px, env(safe-area-inset-top));
                left: 8px;
                gap: 7px;
                padding: 5px 8px;
                min-height: 42px;
                border-radius: 7px;
            }

            .branding-logo { width: 30px; height: 30px; }
            .branding-title { font-size: 10px; }
            .branding-subtitle { margin-top: 2px; font-size: 7px; }

            .fs-toggle {
                top: max(8px, env(safe-area-inset-top));
                right: 8px;
                min-width: 70px;
                min-height: 32px;
                padding: 7px 9px;
                font-size: 8px;
            }

            .loading-logo { width: 55px; height: 55px; }
            .loading-title { font-size: 12px; }
        }

        @media (max-width: 380px) {
            .branding-subtitle { display: none; }
            .branding-title { font-size: 9px; }
            .branding { padding: 5px 7px; }
            .fs-toggle { min-width: 62px; font-size: 7px; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .branding {
                top: 6px;
                left: 8px;
                min-height: 36px;
                padding: 4px 7px;
            }

            .branding-logo { width: 28px; height: 28px; }
            .branding-title { font-size: 9px; }
            .branding-subtitle { display: none; }

            .fs-toggle {
                top: 6px;
                right: 8px;
                min-height: 30px;
                padding: 6px 9px;
            }
        }

        @media print {
            .branding, .fs-toggle, .loading-screen { display: none !important; }
            iframe { position: fixed; inset: 0; }
        }
    </style>

</head>


<body>


    <!-- =====================================================
         MAIN APPLICATION
    ====================================================== -->

    <div
        class="main-container"
        id="fullscreen-target"
    >


        <!-- =================================================
             BRANDING
        ================================================== -->

        <div
            class="branding"
            id="branding"
        >

            <img
                class="branding-logo"
                src="https://rms.rprmd9.site/Video.gif"
                alt="IT Equipment Inventory Logo"
                loading="eager"
            >


            <div class="branding-text">

                <div class="branding-title">
                    IT Equipment Inventory
                </div>

                <div class="branding-subtitle">
                    Inventory Monitoring Portal
                </div>

            </div>

        </div>


        <!-- =================================================
             FULLSCREEN CONTROL
        ================================================== -->

        <button
            type="button"
            class="fs-toggle"
            id="fullscreenButton"

            aria-label="Toggle fullscreen"
            title="Toggle Fullscreen"
        >

            <span id="fullscreenIcon">
                ⛶
            </span>

            <span id="fullscreenText">
                Full View
            </span>

        </button>


        <!-- =================================================
             APPLICATION AREA
        ================================================== -->

        <div class="sheet-container">


            <!-- =============================================
                 LOADING SCREEN
            ============================================== -->

            <div
                class="loading-screen"
                id="loadingScreen"
            >

                <img
                    class="loading-logo"
                    src="https://rms.rprmd9.site/Video.gif"
                    alt="Logo"
                >


                <div class="loading-title">
                    IT Equipment Inventory
                </div>


                <div class="loading-text">
                    Loading Inventory Portal...
                </div>


                <div class="loader"></div>

            </div>


            <!-- =============================================
                 GOOGLE APPS SCRIPT WEB APP
            ============================================== -->

            <iframe
                id="inventoryFrame"

                src="https://script.google.com/macros/s/AKfycbysBZdFCLdUhujlC8F2HVIVoL6YaJGij8TU52m0Toqg65_KJXLTWiQiaZALHMsqcK_4/exec"

                title="IT Equipment Inventory"

                allow="*"

                allowfullscreen

                webkitallowfullscreen

                mozallowfullscreen

                referrerpolicy="no-referrer-when-downgrade"

                loading="eager"

                scrolling="auto">
            </iframe>


        </div>

    </div>


    <script>
        const fullscreenTarget = document.getElementById("fullscreen-target");
        const fullscreenButton = document.getElementById("fullscreenButton");
        const fullscreenIcon = document.getElementById("fullscreenIcon");
        const fullscreenText = document.getElementById("fullscreenText");
        const inventoryFrame = document.getElementById("inventoryFrame");
        const loadingScreen = document.getElementById("loadingScreen");

        function isFullscreen() {
            return !!(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement
            );
        }

        function enterFullscreen() {
            const el = fullscreenTarget;

            try {
                if (el.requestFullscreen) {
                    const result = el.requestFullscreen({ navigationUI: "hide" });
                    if (result && result.catch) result.catch(() => {});
                } else if (el.webkitRequestFullscreen) {
                    el.webkitRequestFullscreen();
                } else if (el.mozRequestFullScreen) {
                    el.mozRequestFullScreen();
                } else if (el.msRequestFullscreen) {
                    el.msRequestFullscreen();
                }
            } catch (_) {}
        }

        function exitFullscreen() {
            try {
                if (document.exitFullscreen) {
                    const result = document.exitFullscreen();
                    if (result && result.catch) result.catch(() => {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            } catch (_) {}
        }

        function toggleFullscreen() {
            if (isFullscreen()) exitFullscreen();
            else enterFullscreen();
        }

        function updateFullscreenButton() {
            const active = isFullscreen();

            fullscreenIcon.textContent = active ? "⛶" : "⛶";
            fullscreenText.textContent = active ? "Exit View" : "Full View";

            fullscreenButton.setAttribute(
                "aria-label",
                active ? "Exit fullscreen" : "Enter fullscreen"
            );

            fullscreenButton.setAttribute(
                "title",
                active ? "Exit Fullscreen" : "Enter Fullscreen"
            );
        }

        /*
         * AUTO FULLSCREEN
         *
         * Browsers intentionally block fullscreen from a completely
         * automatic page-load script. We therefore:
         * 1. Attempt fullscreen immediately on page load.
         * 2. If the browser blocks it, enter fullscreen on the FIRST
         *    user interaction anywhere on the page.
         * 3. The manual Full View button remains available.
         */
        let autoFullscreenDone = false;

        function autoFullscreen() {
            if (autoFullscreenDone || isFullscreen()) return;

            autoFullscreenDone = true;
            enterFullscreen();

            window.removeEventListener("pointerdown", firstInteraction, true);
            window.removeEventListener("touchstart", firstInteraction, true);
            window.removeEventListener("keydown", firstInteraction, true);
        }

        function firstInteraction(event) {
            /*
             * If the user intentionally presses the Full View button,
             * let its own click handler perform the action.
             */
            if (
                event.target === fullscreenButton ||
                fullscreenButton.contains(event.target)
            ) {
                return;
            }

            autoFullscreen();
        }

        fullscreenButton.addEventListener("click", function(event) {
            event.stopPropagation();
            toggleFullscreen();
        });

        document.addEventListener("fullscreenchange", updateFullscreenButton);
        document.addEventListener("webkitfullscreenchange", updateFullscreenButton);
        document.addEventListener("mozfullscreenchange", updateFullscreenButton);
        document.addEventListener("MSFullscreenChange", updateFullscreenButton);

        document.addEventListener("keydown", function(event) {
            const key = event.key.toLowerCase();
            const active = document.activeElement;

            if (
                key === "f" &&
                !event.ctrlKey &&
                !event.altKey &&
                !event.shiftKey &&
                active &&
                !["INPUT", "TEXTAREA", "SELECT"].includes(active.tagName)
            ) {
                toggleFullscreen();
            }
        });

        inventoryFrame.addEventListener("load", function() {
            setTimeout(function() {
                loadingScreen.classList.add("hidden");
            }, 300);
        });

        /* Attempt immediately when the portal opens. */
        window.addEventListener("load", function() {
            setTimeout(autoFullscreen, 100);
        });

        /*
         * Fallback for browsers that reject automatic fullscreen.
         * The first click/touch/key interaction will trigger it.
         */
        window.addEventListener("pointerdown", firstInteraction, true);
        window.addEventListener("touchstart", firstInteraction, {
            capture: true,
            passive: true
        });
        window.addEventListener("keydown", firstInteraction, true);

        /* Prevent accidental double-tap zoom on mobile. */
        let lastTouchEnd = 0;

        document.addEventListener("touchend", function(event) {
            const now = Date.now();

            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }

            lastTouchEnd = now;
        }, { passive: false });

        updateFullscreenButton();
    </script>


</body>
</html>
